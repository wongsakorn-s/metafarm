name: CI

# ตรวจทุกครั้งที่ push เข้า main และทุก pull request — ไม่ใช้ secret ใด ๆ และไม่แตะ Cloudflare
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Type check (astro check)
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Build
        run: bun run build
