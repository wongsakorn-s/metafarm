name: Deploy production

# รันเอง (ปุ่ม "Run workflow") เท่านั้น — ไม่ deploy อัตโนมัติ เพื่อให้ตัดสินใจก่อนทุกครั้ง
# ต้องตั้งค่าก่อนใช้ (ดู docs/10-deploy-runbook.md):
#   Settings → Secrets and variables → Actions:  CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Settings → Environments → production:         เปิด "Required reviewers" ให้ต้องกดอนุมัติ
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify (types, tests, build)
        run: |
          npm run check
          npm test
          npm run build
      - name: Apply D1 migrations (additive only)
        run: npx wrangler d1 migrations apply metafarm-db --remote
      - name: Deploy Worker
        run: npx wrangler deploy
